openapi: 3.1.0
info:
  title: Cosmo Cats Intergalactic Marketplace API
  description: REST API for managing marketplace products
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /api/products:
    get:
      summary: Get list of products
      operationId: getProducts
      
      parameters:
        - name: page
          in: query
          required: false
          schema: 
            type: integer
            minimum: 0
            default: 0
            
        - name: size
          in: query
          required: false
          schema: 
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            
      responses: 
        "200":
          description: List of products retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
                
        "400":
          description: invalid pagination parameters
          content:
            application/problem+json:
              schema: 
                $ref: "#/components/schemas/Problem"
    post:
      summary: Create new product
      operationId: createProduct
      
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              $ref: "#/components/schemas/CreateProductRequest"
              
      responses:
        "201":
          description: Product created
          headers: 
            Location:
              description: Address of created product
              schema:
                type: string
                format: uri-reference
              example: /api/products/1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Body request is invalid
          content: 
            application/problem+json:
              schema: 
                $ref: "#/components/schemas/Problem"
                
  /api/products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        description: Procuct identifier
        schema: 
          type: integer
          format: int64
          minimum: 1
          
    get:
      summary: Get product by productId
      operationId: getProduct
      
      responses: 
        "200":
          description: Product found
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid productId
          content:
            application/problem+json:
              schema: 
                $ref: "#/components/schemas/Problem"
        "404":
          description: Product not found
          content:
            application/problem+json:
              schema: 
                $ref: "#/components/schemas/Problem"
    put:
      summary: Update product by productId
      operationId: updateProduct
      
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      
      responses: 
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid request body
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Product not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      summary: Delete product by productId
      operationId: deleteProduct

      responses:
        "204":
          description: Product is absent after the operation
        "400":
          description: Invalid productId
          content: 
            application/problem+json:
              schema: 
                $ref: "#/components/schemas/Problem"

components: 
  schemas: 
    Product:
      type: object
      required:
        - id
        - name
        - price
      properties: 
        id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: number
          minimum: 0.01
    ProductPage:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties: 
        content:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    CreateProductRequest:
      type: object
      required:
        - name
        - price
      properties: 
        name:
          type: string
        price:
          type: number
          minimum: 0.01
    UpdateProductRequest:
      type: object
      required:
        - name
        - price
      properties: 
        name:
          type: string
          minLength: 1
        price:
          type: number
          minimum: 0.01
    Problem:
      type: object
      required:
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
